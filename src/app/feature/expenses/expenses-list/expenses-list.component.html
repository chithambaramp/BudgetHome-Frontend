<h1 class="pagetitle">Expenses</h1>
<div class="card-grid">
  <div class="card" *ngFor="let card of cards">

    <div class="card-header">
      <span class="icon">{{ card.icon }}</span>
      <span class="title">{{ card.title }}</span>
    </div>

    <div class="card-value">
      ₹ {{ card.value }}
    </div>

  </div>
</div>
