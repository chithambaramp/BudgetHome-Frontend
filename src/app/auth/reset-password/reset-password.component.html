<div class="confirm-modal">

    <!-- Header -->
    <div class="modal-header">
        <h4 class="modal-title">Reset Password</h4>

        <button type="button" class="close-btn" aria-label="Close" (click)="bsModalRef.hide()">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <!-- Error Message -->
    <div class="login-error" *ngIf="error">
        <span class="error-icon">⚠</span>
        <span>{{ error }}</span>
    </div>

    <!-- Body -->
    <div class="modal-body">

        <form [formGroup]="ResetForm">

            <!-- Password -->
            <div class="form-group">
                <label>New Password</label>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input [type]="showPassword() ? 'text' : 'password'" formControlName="password"
                        placeholder="Enter new password"
                        [class.input-error]="f['password'].touched && f['password'].invalid" />
                    <i class="password-toggle" [ngClass]="showPassword() ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"
                        (click)="togglePassword()">
                    </i>
                </div>

                <div class="field-error" *ngIf="f['password'].touched && f['password'].invalid">

                    <span *ngIf="f['password'].errors?.['required']">
                        Password is required.
                    </span>

                    <span *ngIf="f['password'].errors?.['pattern']">
                        Password: 6-15 chars, 1 uppercase, 1 symbol.
                    </span>

                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label>Confirm Password</label>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input [type]="showConfirmPassword() ? 'text' : 'password'" formControlName="confirmPassword"
                        placeholder="Re-enter password"
                        [class.input-error]="(f['confirmPassword'].touched && f['confirmPassword'].invalid) || (f['confirmPassword'].value && ResetForm.hasError('passwordMismatch'))" />
                    <i class="password-toggle"
                        [ngClass]="showConfirmPassword() ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"
                        (click)="toggleConfirmPassword()">
                    </i>
                </div>

                <div class="field-error"
                    *ngIf="(f['confirmPassword'].touched && f['confirmPassword'].invalid) || (f['confirmPassword'].value && ResetForm.hasError('passwordMismatch'))">

                    <span *ngIf="f['confirmPassword'].errors?.['required']">
                        Confirm Password is required
                    </span>

                    <span *ngIf="f['confirmPassword'].value && ResetForm.hasError('passwordMismatch')">
                        Passwords do not match
                    </span>

                </div>
            </div>

        </form>

    </div>

    <!-- Footer -->
    <div class="modal-footer">
        <!-- Button -->
        <button (click)="onSubmit()" type="submit" class="login-btn" [disabled]="isLoading()">
            {{ isLoading() ? 'Loading...' : 'Reset Password' }}
        </button>
    </div>

</div>
