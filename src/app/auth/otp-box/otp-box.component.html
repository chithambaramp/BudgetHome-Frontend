<div class="confirm-modal">

  <!-- Header -->
  <div class="modal-header">
    <h4 class="modal-title">Verify Your Email</h4>

    <button type="button" class="close-btn" aria-label="Close" (click)="bsModalRef.hide()">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <!-- Error Message -->
  <div class="login-error" *ngIf="error">
    <span class="error-icon">⚠</span>
    <span>{{ error }}</span>
  </div>

  <!-- Body -->
  <div class="modal-body">

    <div class="modal-question">
      Enter the 6-digit verification code sent to your email.
    </div>

    <div class="modal-description" *ngIf="Data?.email">
      Verification code sent to
      <span>{{ Data.email }}</span>
    </div>

    <!-- OTP inputs -->
    <div class="otp-inputs">
      <input #otpInput *ngFor="let digit of otpDigits; let i = index; trackBy: trackByIndex" type="text"
        inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" [value]="otpDigits[i]"
        [attr.aria-label]="'OTP digit ' + (i + 1)" (input)="onOtpInput($event, i)" (keydown)="onOtpKeydown($event, i)"
        (paste)="onOtpPaste($event, i)" />
    </div>

    <!-- Resend timer -->
    <div class="otp-resend">
      <span *ngIf="remainingSeconds > 0">
        Resend code in
        <strong>{{ formatTime(remainingSeconds) }}</strong>
      </span>

      <button type="button" class="resend-btn" *ngIf="remainingSeconds === 0" [disabled]="resending"
        (click)="resendOtp()">
        {{ resending ? 'Sending...' : 'Resend OTP' }}
      </button>
    </div>

  </div>

  <!-- Footer -->
  <div class="modal-footer">
    <button type="button" class="cancel-btn" (click)="bsModalRef.hide()">
      Cancel
    </button>

    <button type="button" class="add-btn" [disabled]="otpDigits.join('').length !== 6 || verifying"
      (click)="verifyOtp()">
      {{ verifying ? 'Verifying...' : 'Verify Email' }}
    </button>
  </div>

</div>
