<div class="confirm-modal">

  <!-- Header -->
  <div class="modal-header">
    <h4 class="modal-title">Reset Password</h4>

    <button type="button" class="close-btn" aria-label="Close" (click)="bsModalRef.hide()">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <!-- Error Message -->
  <div class="login-error" *ngIf="error">
    <span class="error-icon">⚠</span>
    <span>{{ error }}</span>
  </div>

  <!-- Body -->
  <div class="modal-body">

    <div class="modal-description">
      Enter the email address associated with your account
    </div>

    <form [formGroup]="ForgotForm" (ngSubmit)="onSubmit()">

      <!-- Email -->
      <div class="form-group">
        <label>Email Address</label>

        <div class="input-group">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" formControlName="email" placeholder="Enter your email"
            [class.input-error]="f['email'].touched && f['email'].invalid" />
        </div>

        <div class="field-error" *ngIf="f['email'].touched && f['email'].invalid">

          <span *ngIf="f['email'].errors?.['required']">
            Email is required
          </span>

          <span *ngIf="f['email'].errors?.['email']">
            Enter a valid email address
          </span>

        </div>
      </div>

      <!-- Button -->
      <button type="submit" class="login-btn" [disabled]="isLoading()">
        {{ isLoading() ? 'Sending...' : 'Send OTP' }}
      </button>

    </form>

  </div>

  <!-- Footer -->
  <div class="modal-footer">
    <label>Back to</label><a (click)="login()">Login</a>
  </div>

</div>
