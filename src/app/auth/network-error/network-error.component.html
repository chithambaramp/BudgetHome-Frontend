<div class="network-page">

    <div class="network-card">

        <!-- Illustration -->
        <div class="signal-frame">

            <div class="signal-icon">
                <span class="signal-bar bar-1"></span>
                <span class="signal-bar bar-2"></span>
                <span class="signal-bar bar-3"></span>
                <span class="signal-bar bar-4"></span>

                <span class="signal-cut"></span>
            </div>

            <div class="error-badge">
                ×
            </div>

        </div>

        <!-- Content -->
        <div class="error-content">

            <span class="error-label">
                NETWORK ERROR
            </span>

            <h1>
                No Signal
            </h1>

            <p>
                Your network connection has been interrupted.
                Please check your internet connection and try again.
            </p>

        </div>

        <!-- Buttons -->
        <div class="error-actions">

            <button type="button" class="btn-primary" (click)="retry()">
                Try Again
            </button>

            <button type="button" class="btn-secondary" (click)="goHome()">
                Back to Home
            </button>

        </div>

    </div>

</div>
